name: Build and push image

on:
  push:
    branches: [main]
    paths-ignore:
      - backstage-values.yaml

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn tsc
      - run: yarn build:backend

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Bump image tag in backstage-values.yaml
        run: |
          # Matches only a "tag:" line whose current value is a 40-char hex
          # commit SHA, not any "tag:" line — narrower than the old blanket
          # `s|tag: .*|...|`, which would silently rewrite a second "tag:" key
          # too if one is ever added elsewhere in this file (a sidecar image,
          # another subchart value). Tried yq and ruamel.yaml first: both
          # reformat the file on write (yq drops every blank line; ruamel
          # reindents every list under a mapping key and rewrites explicit
          # nulls) — worse than the problem being fixed, given this is a
          # hand-maintained values file with a lot of "# --" doc comments.
          sed -i -E "s|tag: [0-9a-f]{40}|tag: ${{ github.sha }}|" backstage-values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backstage-values.yaml
          git commit -m "Deploy ${{ github.sha }}"
          git push
